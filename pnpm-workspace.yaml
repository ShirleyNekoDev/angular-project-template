allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # Native bindings for the TS-aware resolver used by eslint-plugin-import-x
  unrs-resolver: true
autoInstallPeers: false
overrides:
  '@angular/animations': '22.2.3'
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  # GHSA-g3hv-75wg-m249 (DoS), pulled in by eslint
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  # GHSA-238p-pmpm-9mq7 (prototype pollution), pulled in by markdownlint (math parsing)
  katex@<0.18.2: ^0.18.2
  vite@>=8.3.0 <=8.3.3: ^8.3.3
  webpack-dev-middleware@<7.4.5: ^7.4.5
  zod@<4.6.6: ^4.6.6
  # App is zoneless: forbid zone.js in the graph so @angular/build:unit-test's zone
  # detection stays in 'none' mode (it otherwise finds zone.js hoisted in
  # node_modules/.pnpm/node_modules via transitive optional peers and breaks).
  # See https://github.com/angular/angular-cli/issues/33435
  zone.js: '-'
